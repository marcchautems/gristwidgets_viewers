<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="index.js"></script>
    <style>
      #status {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: sans-serif;
        font-size: 1.1em;
        color: #888;
      }
      html, body, .viewer-frame, #viewer {
        height: 100%;
        width: 100%;
        padding: 0px;
        border: 0px;
        margin: 0px;
        overflow: hidden;
      }
      .viewer-frame {
        display: block;
      }
      .image-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
      }
      .viewer-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .viewer-text {
        margin: 0;
        padding: 1em;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: monospace;
        font-size: 0.9em;
      }
      #attachment-nav {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 4px 14px;
        border-radius: 16px;
        font-family: sans-serif;
        font-size: 0.9em;
        z-index: 10;
      }
      #attachment-nav button {
        background: none;
        border: none;
        color: #fff;
        font-size: 1.2em;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
      }
      #attachment-nav button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="viewer" style="display:none"></div>
    <div id="attachment-nav">
      <button id="prev-attachment">‹</button>
      <span id="attachment-counter"></span>
      <button id="next-attachment">›</button>
    </div>
  </body>
</html>
