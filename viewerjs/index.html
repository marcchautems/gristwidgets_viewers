<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="index.js"></script>
    <style>
      #status {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: sans-serif;
        font-size: 1.1em;
        color: #888;
      }
      html, body, .viewer-frame, #viewer {
        height: 100%;
        width: 100%;
        padding: 0px;
        border: 0px;
        margin: 0px;
        overflow: hidden;
      }
      .viewer-frame {
        display: block;
      }
      .image-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
      }
      .viewer-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .viewer-text {
        margin: 0;
        padding: 1em;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: monospace;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="viewer" style="display:none"></div>
  </body>
</html>
