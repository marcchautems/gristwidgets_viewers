<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="index.js"></script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        padding: 0px;
        border: 0px;
        margin: 0px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
      }
      #status {
        flex: 1;
        padding-top: 40vh;
        text-align: center;
        font-size: 1.1em;
        color: #888;
      }
      #doc-title {
        flex: none;
        padding: 6px 12px;
        background: #f4f4f4;
        border-bottom: 1px solid #ddd;
        font-weight: 600;
        font-size: 0.95em;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #search-bar {
        flex: none;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: #f4f4f4;
        border-bottom: 1px solid #ddd;
        font-size: 0.9em;
      }
      #search-input {
        flex: 0 1 260px;
        min-width: 80px;
        padding: 4px 8px;
        border: 1px solid #bbb;
        border-radius: 4px;
        font-size: 1em;
      }
      #search-input:focus {
        outline: 2px solid #2a6fc9;
        outline-offset: -1px;
        border-color: #2a6fc9;
      }
      #search-bar button {
        width: 26px;
        height: 26px;
        border: 1px solid #bbb;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 0.9em;
        line-height: 1;
      }
      #search-bar button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #search-count {
        color: #666;
        white-space: nowrap;
      }
      #viewer {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #pdf-pane, #content-pane {
        position: absolute;
        inset: 0;
        display: none;
      }
      .viewer-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .html-frame {
        background: #fff;
      }
      .image-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f4f4;
      }
      .viewer-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .viewer-text {
        margin: 0;
        padding: 1em;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        overflow: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: monospace;
        font-size: 0.9em;
      }
      #attachment-nav {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 10px;
        background: #2a6fc9;
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        font-size: 0.95em;
        font-weight: 600;
        z-index: 10;
      }
      #attachment-nav button {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: 50%;
        color: #fff;
        width: 28px;
        height: 28px;
        font-size: 1.2em;
        line-height: 1;
        cursor: pointer;
      }
      #attachment-nav button:not(:disabled):hover {
        background: rgba(255, 255, 255, 0.35);
      }
      #attachment-nav button:disabled {
        opacity: 0.35;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="doc-title" style="display:none"></div>
    <div id="search-bar" style="display:none">
      <input id="search-input" type="search" placeholder="Search… (Ctrl+F)" autocomplete="off">
      <button id="search-prev" title="Previous match (Shift+Enter)" disabled>▲</button>
      <button id="search-next" title="Next match (Enter)" disabled>▼</button>
      <span id="search-count"></span>
    </div>
    <div id="status"></div>
    <div id="viewer" style="display:none">
      <div id="pdf-pane"></div>
      <div id="content-pane"></div>
    </div>
    <div id="attachment-nav">
      <button id="prev-attachment">‹</button>
      <span id="attachment-counter"></span>
      <button id="next-attachment">›</button>
    </div>
  </body>
</html>
